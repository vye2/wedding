<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Victor &amp; Ashley · Save the Date</title>

  <!-- SEO -->
  <meta name="description" content="Victor &amp; Ashley are getting married — Saturday, May 15, 2027, in the San Francisco Bay Area. Save the date. Formal invitation to follow." />
  <meta name="theme-color" content="#9caf88" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Victor &amp; Ashley · Save the Date" />
  <meta property="og:description" content="Saturday, May 15, 2027 · San Francisco Bay Area. Formal invitation to follow." />
  <meta property="og:image" content="assets/og-image.png" />
  <meta property="og:site_name" content="Victor &amp; Ashley" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Victor &amp; Ashley · Save the Date" />
  <meta name="twitter:description" content="Saturday, May 15, 2027 · San Francisco Bay Area." />
  <meta name="twitter:image" content="assets/og-image.png" />

  <!-- Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Fonts: Cormorant Garamond (display serif) + Inter (labels) + Great Vibes (calligraphy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bespoke save-the-date theme (mirrors the locked sage + blush palette) -->
  <link rel="stylesheet" href="css/save-the-date.css" />

  <!-- No-JS fallback: hide the envelope pieces so the sandwiched letter shows. -->
  <noscript>
    <style>
      .env__back, .env__front, .env__flap, .env__tip-glow, .env__open,
      .opener__hint { display: none !important; }
      .stage::before { display: none !important; }
    </style>
  </noscript>
</head>
<body>
  <a class="skip-link" href="#std-main">Skip to the details</a>

  <!-- Drifting petals live behind everything (generated by JS for organic motion) -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- ============================================================= -->
  <!-- THE OPENER — a full-screen stage holding the couple's own       -->
  <!-- envelope in layered pieces (env-back/front/flap). Tap to open:   -->
  <!-- the flap flips up, the letter inside is glimpsed, then it slides. -->
  <!-- ============================================================= -->
  <div class="opener" id="opener">
    <div class="stage" role="group" aria-label="A sealed envelope from Victor and Ashley">
      <!-- Back of the envelope pocket (solid) -->
      <div class="env__back" aria-hidden="true"></div>

      <!-- THE LETTER — the actual save-the-date, sandwiched inside the envelope
           (between the back and the front pocket). Its top is glimpsed when the
           flap lifts; the whole letter is exposed as the envelope slides down. -->
      <main class="std" id="std-main" aria-labelledby="std-names">
        <div class="std__content">
          <p class="std__eyebrow">Save the Date</p>

          <div class="std__sprig" aria-hidden="true">
            <svg viewBox="0 0 240 60" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M120 12 C120 30 120 40 120 52" fill="none" stroke="#9caf88" stroke-width="1.6" stroke-linecap="round"/>
              <g fill="#b2c2a8">
                <ellipse cx="120" cy="10" rx="7" ry="4" />
                <ellipse cx="112" cy="22" rx="9" ry="4.5" transform="rotate(28 112 22)" />
                <ellipse cx="128" cy="22" rx="9" ry="4.5" transform="rotate(-28 128 22)" />
                <ellipse cx="110" cy="35" rx="8" ry="4" transform="rotate(30 110 35)" />
                <ellipse cx="130" cy="35" rx="8" ry="4" transform="rotate(-30 130 35)" />
              </g>
              <g stroke="#cdd9c2" stroke-width="1.2" stroke-linecap="round">
                <line x1="6" y1="30" x2="96" y2="30" />
                <line x1="144" y1="30" x2="234" y2="30" />
              </g>
              <g fill="#e79aa8">
                <circle cx="96" cy="30" r="2.4" />
                <circle cx="144" cy="30" r="2.4" />
              </g>
            </svg>
          </div>

          <h1 class="std__names" id="std-names">
            Victor Ye <span class="std__amp">&amp;</span> Ashley Huynh
          </h1>

          <p class="std__script">are getting married</p>

          <p class="std__date">Saturday, May 15th, 2027</p>

          <p class="std__place">San Francisco Bay Area</p>

          <!-- Slim live countdown (reads the date in js/save-the-date.js) -->
          <div class="std-count" id="countdown" role="timer" aria-label="Time remaining until the wedding day">
            <div class="std-count__unit"><span class="std-count__num" data-unit="days">--</span><span class="std-count__label">Days</span></div>
            <div class="std-count__sep" aria-hidden="true"></div>
            <div class="std-count__unit"><span class="std-count__num" data-unit="hours">--</span><span class="std-count__label">Hrs</span></div>
            <div class="std-count__sep" aria-hidden="true"></div>
            <div class="std-count__unit"><span class="std-count__num" data-unit="minutes">--</span><span class="std-count__label">Min</span></div>
            <div class="std-count__sep" aria-hidden="true"></div>
            <div class="std-count__unit"><span class="std-count__num" data-unit="seconds">--</span><span class="std-count__label">Sec</span></div>
          </div>
          <p class="std-count__done" id="countdown-done" hidden>Today is the day — with all our love, thank you for celebrating with us. 🌿</p>

          <p class="std__follow">Formal invitation to follow</p>
        </div>
      </main>

      <!-- Front of the pocket — covers the letter's lower half -->
      <div class="env__front" aria-hidden="true"></div>

      <!-- The flap: shown flipped DOWN over the pocket (closed); rotates up about
           its hinge to open. One image serves both faces. -->
      <div class="env__flap" id="flap" aria-hidden="true"></div>

      <!-- Soft glow — the 'open here' cue (no wax seal) -->
      <span class="env__tip-glow" aria-hidden="true"></span>

      <!-- Transparent control covering the whole envelope (keyboard + a11y) -->
      <button class="env__open" id="open-btn" type="button"
              aria-label="Open the envelope from Victor and Ashley"></button>
    </div>

    <p class="opener__hint" id="opener-hint">
      <span class="opener__hint-text">Tap to open</span>
    </p>
  </div>

  <!-- SVG filter that gives the letter its torn, handmade deckle edge -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="deckle" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.013 0.021" numOctaves="3" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <script src="js/save-the-date.js"></script>
</body>
</html>

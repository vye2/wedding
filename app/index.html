<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Victor &amp; Ashley · Save the Date</title>

  <!-- The names and the date appear here as literal text, not from
       app/src/config.ts. Crawlers and link previews read the HTML before
       any script runs, so these can't be derived. Change config.ts and
       change them here too. -->

  <!-- SEO -->
  <meta name="description" content="Victor &amp; Ashley are getting married — Saturday, May 15, 2027, in the San Francisco Bay Area. Save the date. Formal invitation to follow." />
  <meta name="theme-color" content="#9caf88" />

  <!-- Open Graph. Absolute URLs: several crawlers refuse to resolve a
       relative og:image, and this page is only ever served from the one
       domain. NOTE: assets/og-image.png is not in the repo yet — add a
       1200×630 export there, or point these at an image that exists. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ashleyhuynh.victorye.me/save-the-date.html" />
  <meta property="og:title" content="Victor &amp; Ashley · Save the Date" />
  <meta property="og:description" content="Saturday, May 15, 2027 · San Francisco Bay Area. Formal invitation to follow." />
  <meta property="og:image" content="https://ashleyhuynh.victorye.me/assets/og-image.png" />
  <meta property="og:site_name" content="Victor &amp; Ashley" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Victor &amp; Ashley · Save the Date" />
  <meta name="twitter:description" content="Saturday, May 15, 2027 · San Francisco Bay Area." />
  <meta name="twitter:image" content="https://ashleyhuynh.victorye.me/assets/og-image.png" />

  <!-- Icon -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <!-- Start the backdrop downloading immediately. Left to the stylesheet it isn't
       discovered until the CSS has parsed, which is what made the envelope show up
       first against a blank page. The URL must match the one in tokens.css exactly,
       ?v= included, or the browser fetches the image twice. -->
  <link rel="preload" as="image" href="/assets/bg-floral.webp?v=4" type="image/webp" fetchpriority="high" />

  <!-- Fonts: Cormorant Garamond (display serif) + Inter (labels) + Great Vibes (calligraphy).
       Cormorant 300 is requested for the daintier "Save the Date"; without it here
       the browser would fall back to 400 and the line would lose its fineness. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>

  <!-- NO-JAVASCRIPT FALLBACK.

       The old page was hand-written HTML, so with scripts off it could
       just un-hide the letter that was already in the markup. A React app
       has no markup until it runs, so without this the page would be a
       floral backdrop and nothing else.

       This is the save-the-date reduced to what actually matters — who,
       when, and that a real invitation is coming. It is deliberately
       self-contained: literal colours rather than the palette's custom
       properties, and no reliance on the bundle having loaded, because
       the whole point is that something has gone wrong. Keep the names
       and date in step with config.ts. -->
  <noscript>
    <style>
      .nojs {
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center; padding: 8vmin;
        background: rgba(250, 247, 242, 0.55);
      }
      .nojs__card {
        max-width: 30rem; width: 100%;
        padding: 3rem 2.5rem 2.75rem;
        text-align: center;
        background: #f8f3ea;
        border-radius: 3px;
        box-shadow: 0 0 2rem rgba(66, 52, 46, 0.24), 0 1rem 2.5rem -0.6rem rgba(66, 52, 46, 0.3);
      }
      .nojs__eyebrow {
        margin: 0 0 1.5rem;
        font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300;
        font-size: 1.05rem; letter-spacing: 0.34em; text-indent: 0.34em;
        text-transform: uppercase; color: #6f6a62;
      }
      .nojs__names {
        margin: 0;
        font-family: 'Great Vibes', 'Cormorant Garamond', cursive; font-weight: 400;
        font-size: clamp(2.6rem, 11vw, 3.4rem); line-height: 1.02; color: #3d3a36;
      }
      .nojs__rule {
        width: 44%; height: 1px; margin: 1.5rem auto;
        background: linear-gradient(to right, transparent, #cbb27e, transparent);
      }
      .nojs__date {
        margin: 0;
        font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500;
        font-size: clamp(1.3rem, 5.5vw, 1.6rem); line-height: 1; color: #3d3a36;
      }
      .nojs__date sup { font-size: 0.5em; vertical-align: 0.72em; }
      .nojs__follow {
        margin: 1.35rem 0 0;
        font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
        font-size: 1.05rem; color: #50633f;
      }
    </style>
    <div class="nojs">
      <div class="nojs__card">
        <p class="nojs__eyebrow">Save the Date</p>
        <h1 class="nojs__names">Victor &amp; Ashley</h1>
        <div class="nojs__rule"></div>
        <p class="nojs__date">Saturday, May 15<sup>th</sup>, 2027</p>
        <p class="nojs__follow">Formal invitation to follow</p>
      </div>
    </div>
  </noscript>

  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
